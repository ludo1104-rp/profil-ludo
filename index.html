<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROFIL.EXE — Qui est votre formateur ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --screen:#0A0E0A;
    --phosphor:#33FF66;
    --phosphor-dim:#1E9940;
    --amber:#FFB000;
    --amber-dim:#8A5F00;
    --wrong:#FF4B3E;
    --term:'VT323', 'Courier New', monospace;
    --pixel:'Press Start 2P', 'Courier New', monospace;
  }

  *{box-sizing:border-box}

  html{height:100%}

  body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    min-height:100dvh;
    padding:max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    font-family:var(--term);
    color:var(--phosphor);
  }

  .monitor{
    width:100%;
    max-width:640px;
    background:var(--screen);
    border:2px solid #1a2a1a;
    border-radius:14px;
    box-shadow:
      0 0 0 6px #141614,
      0 0 60px rgba(51,255,102,.09) inset,
      0 0 30px rgba(0,0,0,.9);
    padding:26px 22px 26px;
    position:relative;
    overflow:hidden;
    /* l'écran remplit toute la hauteur (format téléphone) */
    flex:1 0 auto;
    min-height:min(560px, calc(100dvh - 60px));
    display:flex;
    flex-direction:column;
  }

  /* scanlines */
  .monitor::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      180deg,
      rgba(0,0,0,0) 0 2px,
      rgba(0,0,0,.28) 2px 4px);
    z-index:5;
  }
  /* vignette bombée */
  .monitor::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    z-index:4;
  }

  .crt{position:relative; z-index:6; flex:1; display:flex; flex-direction:column}
  .crt > .offscreen, .crt > .quoteblock{flex:1}

  /* ---------- barre système ---------- */
  .sysbar{
    font-family:var(--term);
    font-size:19px;
    color:var(--phosphor-dim);
    border-bottom:1px solid var(--phosphor-dim);
    padding-bottom:7px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    gap:12px;
    letter-spacing:.5px;
  }

  h1{
    font-family:var(--pixel);
    font-size:clamp(12px, 3.4vw, 17px);
    line-height:1.9;
    color:var(--amber);
    margin:0 0 18px;
    text-shadow:0 0 12px rgba(255,176,0,.45);
  }

  p{
    font-size:21px;
    line-height:1.45;
    margin:0 0 14px;
    max-width:56ch;
  }

  .dim{color:var(--phosphor-dim)}

  .cursor{
    display:inline-block;
    width:10px; height:19px;
    background:var(--phosphor);
    vertical-align:-3px;
    margin-left:3px;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* ---------- boutons ---------- */
  button{
    font-family:var(--term);
    background:transparent;
    color:var(--phosphor);
    border:1px solid var(--phosphor-dim);
    border-radius:0;
    cursor:pointer;
    text-align:left;
  }
  button:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

  .start{
    font-family:var(--pixel);
    font-size:11px;
    line-height:1.8;
    padding:14px 18px;
    color:var(--screen);
    background:var(--phosphor);
    border:none;
    margin-top:6px;
  }
  @media (hover:hover){ .start:hover{background:var(--amber)} }

  .options{display:flex; flex-direction:column; gap:8px; margin-top:18px}

  .opt{
    font-size:20px;
    line-height:1.35;
    padding:11px 13px;
    display:flex;
    gap:11px;
    align-items:baseline;
  }
  .opt .key{color:var(--amber); flex:none}
  @media (hover:hover){
    .opt:hover:not(:disabled){background:rgba(51,255,102,.10)}
  }
  .opt:disabled{cursor:default}

  /* états après réponse — volontairement distincts */
  .opt.is-answer{
    border-color:var(--phosphor);
    background:rgba(51,255,102,.14);
    color:var(--phosphor);
  }
  .opt.is-answer .key{color:var(--phosphor)}
  .opt.is-wrongpick{
    border-color:var(--wrong);
    color:var(--wrong);
    text-decoration:line-through;
    opacity:.85;
  }
  .opt.is-wrongpick .key{color:var(--wrong)}
  .opt.is-mute{opacity:.32}

  /* ---------- révélation ---------- */
  .reveal{
    margin-top:20px;
    border-left:3px solid var(--amber);
    padding:4px 0 4px 14px;
  }
  /* terminal : symboles ASCII, seuls glyphes presents dans la police pixel */
  .reveal .verdict .mark{
    font-family:var(--term);
    font-size:19px;
    line-height:1;
    margin-right:7px;
    letter-spacing:0;
  }
  .reveal .verdict.ok .mark{color:var(--phosphor)}
  .reveal .verdict.ko .mark{color:var(--wrong)}
  .reveal .verdict.ok .mark::before{content:"[OK]"}
  .reveal .verdict.ko .mark::before{content:"[X]"}

  .reveal .verdict{
    font-family:var(--pixel);
    font-size:9px;
    line-height:1.9;
    display:block;
    margin-bottom:10px;
    color:var(--amber);
  }
  .reveal p{margin-bottom:16px}

  .next{
    font-size:20px;
    padding:9px 15px;
    color:var(--amber);
    border-color:var(--amber-dim);
  }
  @media (hover:hover){ .next:hover{background:rgba(255,176,0,.14)} }

  /* ---------- progression ---------- */
  .progress{
    font-size:20px;
    color:var(--phosphor-dim);
    letter-spacing:2px;
    margin:0 0 6px;
  }
  .progress b{color:var(--amber); font-weight:normal}

  /* ---------- final ---------- */
  .log{margin:0 0 22px; padding:0; list-style:none}
  .log li{
    font-size:20px;
    line-height:1.45;
    margin-bottom:13px;
    padding-left:20px;
    text-indent:-20px;
    max-width:56ch;
  }
  .log li::before{content:"> "; color:var(--amber)}

  .block{
    border:1px solid var(--phosphor-dim);
    padding:16px 16px 4px;
    margin:0 0 20px;
  }
  .block h2{
    font-family:var(--pixel);
    font-size:10px;
    line-height:1.9;
    color:var(--amber);
    margin:0 0 14px;
  }
  strong{color:var(--amber); font-weight:normal}

  .twist{
    border:1px dashed var(--amber-dim);
    padding:16px 16px 4px;
    color:var(--amber);
  }
  .twist p{color:var(--amber)}

  .pcanvas{
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    border:1px solid var(--phosphor-dim);
    margin:16px auto 0;
    width:100%;
    max-width:230px;
    height:auto;
  }

  .portrait{
    display:block;
    width:132px;
    height:auto;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    margin:0 0 16px;
    border:1px solid var(--phosphor-dim);
  }

  .score{
    font-size:22px;
    margin-bottom:22px;
  }

  .ps{
    font-size:19px;
    line-height:1.5;
    color:var(--amber);
    border-top:1px solid var(--amber-dim);
    padding-top:14px;
    margin:22px 0 0;
    max-width:52ch;
  }

  .replay{
    margin-top:20px;
    font-size:19px;
    padding:9px 14px;
  }
  @media (hover:hover){ .replay:hover{background:rgba(51,255,102,.1)} }

  /* ---------- séquences animées ---------- */
  .boot{
    font-size:16px;
    line-height:1.5;
    margin:0;
    white-space:pre-wrap;
    min-height:250px;
  }
  .boot .ok{color:var(--amber)}
  .boot .hi{color:#B9FFCB}
  .boot .err{color:var(--wrong)}

  /* --- écran éteint + allumage --- */
  .monitor.off{
    background:#050705;
    box-shadow:0 0 0 6px #141614, 0 0 30px rgba(0,0,0,.9);
  }
  .monitor.off::before, .monitor.off::after{opacity:.35}

  .offscreen{
    min-height:300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  .pwr{
    width:74px; height:74px;
    border-radius:50%;
    border:2px solid var(--phosphor-dim);
    background:#0C120C;
    color:var(--phosphor-dim);
    font-size:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    transition:color .2s, border-color .2s, box-shadow .2s;
  }
  .pwr:hover, .pwr:focus-visible{
    color:var(--phosphor);
    border-color:var(--phosphor);
    box-shadow:0 0 24px rgba(51,255,102,.45);
  }
  .pwrlabel{
    font-family:var(--pixel);
    font-size:9px;
    line-height:1.9;
    color:var(--phosphor-dim);
    text-align:center;
    margin:0;
  }

  .poweron{position:absolute; inset:0; z-index:9; pointer-events:none}
  .poweron .pbar{
    position:absolute; left:0; right:0; height:50%;
    background:#000;
    transition:transform .40s ease-out;
  }
  .poweron .pbar.top{top:0; transform-origin:top}
  .poweron .pbar.bot{bottom:0; transform-origin:bottom}
  .poweron .beam{
    position:absolute; left:0; right:0; top:calc(50% - 1px);
    height:2px;
    background:#EAFFF1;
    box-shadow:0 0 26px 5px rgba(124,255,168,.85);
    transform:scaleX(0);
    transition:transform .28s ease-out, opacity .45s linear;
  }

  canvas.rain{
    position:absolute;
    inset:0;
    z-index:3;
    opacity:1;
    transition:opacity .9s linear;
  }
  canvas.rain.out{opacity:0}

  .quoteblock{
    min-height:230px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:14px;
  }
  .quoteblock .line{
    font-size:23px;
    line-height:1.4;
    color:#B9FFCB;
    text-shadow:0 0 14px rgba(51,255,102,.6);
    max-width:44ch;
  }
  .quoteblock p{white-space:pre-wrap}
  .tc{
    display:inline-block;
    width:9px; height:17px;
    background:var(--phosphor);
    vertical-align:-3px;
    animation:blink .9s steps(1) infinite;
  }

  .quoteblock .conn{
    font-size:21px;
    line-height:1.5;
    color:var(--phosphor);
    max-width:46ch;
  }
  .dots::after{
    content:"";
    animation:dots 1.1s steps(4, end) infinite;
  }
  @keyframes dots{
    0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} 100%{content:""}
  }

  .quoteblock .ask{
    font-size:21px;
    color:var(--amber);
    margin-top:2px;
  }
  .quoteblock .loadbar{
    font-size:20px;
    letter-spacing:1px;
    color:var(--phosphor);
    margin-top:6px;
  }
  .quoteblock.fadeout{
    opacity:0;
    transition:opacity .45s linear;
  }

  .sweep{
    position:absolute;
    left:0; right:0; top:0;
    height:4px;
    background:#EAFFF1;
    box-shadow:0 0 28px 7px rgba(124,255,168,.9);
    z-index:9;
    transform:translateY(0);
    transition:transform .55s ease-in, opacity .25s linear .45s;
  }
  .sweep.go{
    transform:translateY(var(--sweepto, 460px));
    opacity:0;
  }

  .quoteblock .errlog{
    font-size:17px;
    line-height:1.5;
    color:var(--amber-dim);
    max-width:52ch;
    margin-top:-4px;
  }

  .quoteblock .fix{
    font-size:20px;
    color:var(--wrong);
  }

  .skip{
    position:absolute;
    right:20px; bottom:16px;
    font-size:17px;
    color:var(--phosphor-dim);
    z-index:7;
  }

  .meter{
    font-size:20px;
    letter-spacing:2px;
    color:var(--amber);
    margin:18px 0 0;
  }

  @media (prefers-reduced-motion: reduce){
    .cursor{animation:none}
  }

  @media (max-width:430px){
    .monitor{padding:20px 15px}
    p, .opt, .log li{font-size:19px}
  }

  /* =========================================================
     ECRAN DE CHOIX D'AFFICHAGE — cartes uniformes + apercu
     ========================================================= */
  .themes{display:flex; flex-direction:column; gap:11px; margin-top:20px}

  .tsw{
    display:flex; align-items:center; gap:15px;
    width:100%; text-align:left; cursor:pointer;
    padding:13px 15px;
    background:transparent;
    border:1px solid var(--phosphor-dim);
    border-radius:0;
    font-family:var(--term);
    color:var(--phosphor);
  }
  @media (hover:hover){
    .tsw:hover{background:rgba(51,255,102,.10)}
  }
  .tsw .name{font-size:22px; line-height:1.2; display:block}
  .tsw .desc{font-size:17px; line-height:1.3; display:block; color:var(--phosphor-dim); margin-top:3px}

  /* vignette d'apercu : trois bandes aux couleurs du theme + un faux bouton */
  .swatch{
    flex:none; width:58px; height:52px;
    display:flex; flex-direction:column; justify-content:center; gap:5px;
    padding:7px;
    border:1px solid rgba(255,255,255,.18);
  }
  .swatch i{display:block; height:5px; border-radius:2px}
  .swatch b{display:block; height:13px; margin-top:2px}

  .sw-term .swatch{background:#0A0E0A}
  .sw-term .swatch i{background:#1E9940}
  .sw-term .swatch i:first-child{background:#33FF66; width:70%}
  .sw-term .swatch b{background:#FFB000; border-radius:0}

  .sw-uni .swatch{background:linear-gradient(150deg,#FFD1F0,#D9C8FF)}
  .sw-uni .swatch i{background:#C9A6E0; border-radius:3px}
  .sw-uni .swatch i:first-child{background:#FF3FA4; width:70%}
  .sw-uni .swatch b{background:#fff; border:2px solid #FF6FC8; border-radius:9px}

  .sw-min .swatch{background:#FFFFFF}
  .sw-min .swatch i{background:#C9C9C7; border-radius:1px}
  .sw-min .swatch i:first-child{background:#1B1B1B; width:70%}
  .sw-min .swatch b{background:#1B1B1B; border-radius:3px}

  .themeswitch{
    display:block; margin-top:16px;
    font-size:17px; padding:7px 12px; opacity:.75;
  }

  /* l'ecran de choix reprend les couleurs du theme en cours */
  body.t-minimal .tsw{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    border:1px solid #C9C9C7; border-radius:6px; color:#1B1B1B; background:#fff;
  }
  body.t-minimal .tsw .name{font-size:18px; font-weight:600}
  body.t-minimal .tsw .desc{font-size:15px; color:#6E6E6C}
  body.t-minimal .swatch{border:1px solid #E2E2E0}
  @media (hover:hover){ body.t-minimal .tsw:hover{background:#F3F3F1} }

  body.t-unicorn .tsw{
    font-family:'Fredoka',system-ui,sans-serif;
    border:3px solid #FF6FC8; border-radius:20px; color:#5B2D82;
    background:#fff; box-shadow:0 4px 0 #FFC2E6;
  }
  body.t-unicorn .tsw .name{font-size:19px}
  body.t-unicorn .tsw .desc{font-size:15px; color:#9B7BB8}
  body.t-unicorn .swatch{border:2px solid #FFC2E6; border-radius:10px}
  @media (hover:hover){ body.t-unicorn .tsw:hover{background:#FFF3FB} }

  /* =========================================================
     THEME LICORNE
     ========================================================= */
  body.t-unicorn{background:linear-gradient(165deg,#FFD1F0 0%,#D9C8FF 48%,#BFEBFF 100%)}
  body.t-unicorn .monitor{
    background:rgba(255,255,255,.78);
    border:4px dashed #FF6FC8;
    border-radius:26px;
    box-shadow:0 10px 0 rgba(255,111,200,.3);
    font-family:'Fredoka',system-ui,sans-serif;
    color:#5B2D82;
  }
  body.t-unicorn .monitor::after,
  body.t-unicorn .monitor::before{opacity:0}
  body.t-unicorn .sysbar{color:#B06AD0; border-bottom:2px dotted #FF9BD9}
  body.t-unicorn h1{
    font-family:'Fredoka',sans-serif; font-size:26px; line-height:1.25;
    color:#FF3FA4; text-shadow:2px 2px 0 #FFE45E;
  }
  body.t-unicorn p, body.t-unicorn .log li{font-size:18px; color:#5B2D82}
  body.t-unicorn .dim{color:#9B7BB8}
  body.t-unicorn .progress{color:#C9A6E0}
  body.t-unicorn .progress b{color:#FF3FA4}
  body.t-unicorn .opt, body.t-unicorn .next,
  body.t-unicorn .replay, body.t-unicorn .themeswitch{
    font-family:'Fredoka',sans-serif; font-size:18px;
    background:#fff; color:#5B2D82;
    border:3px solid #FF6FC8; border-radius:22px;
    box-shadow:0 4px 0 #FFC2E6;
  }
  body.t-unicorn .opt .key{color:#FF3FA4}
  @media (hover:hover){
    body.t-unicorn .opt:hover:not(:disabled){background:#FFF3FB}
  }
  body.t-unicorn .opt.is-answer{background:#E4FFEF; border-color:#2FBF71; color:#1F7A48}
  body.t-unicorn .opt.is-answer .key{color:#2FBF71}
  body.t-unicorn .opt.is-wrongpick{background:#FFECEC; border-color:#FF7A7A; color:#C0392B}
  body.t-unicorn .opt.is-wrongpick .key{color:#C0392B}
  body.t-unicorn .start{
    font-family:'Fredoka',sans-serif; font-size:20px;
    background:#FF3FA4; color:#fff; border:none;
    border-radius:26px; box-shadow:0 5px 0 #C71E7A;
  }
  body.t-unicorn .reveal{border-left:4px solid #FF6FC8}
  body.t-unicorn .verdict .mark{font-family:inherit; font-size:20px; vertical-align:-1px}
  body.t-unicorn .verdict.ok .mark{color:#2FBF71}
  body.t-unicorn .verdict.ko .mark{color:#C0392B}
  body.t-unicorn .verdict.ok .mark::before{content:"\2713"}
  body.t-unicorn .verdict.ko .mark::before{content:"\2717"}
  body.t-unicorn .verdict, body.t-unicorn .block h2{
    font-family:'Fredoka',sans-serif; font-size:17px; color:#FF3FA4;
  }
  body.t-unicorn .block{border:3px solid #D9C8FF; border-radius:18px; background:#FBF6FF}
  body.t-unicorn strong{color:#FF3FA4; font-weight:600}
  body.t-unicorn .twist{border:3px dashed #FFB347; background:#FFF9E8; border-radius:18px}
  body.t-unicorn .twist p{color:#8A5A00}
  body.t-unicorn .log li::before{content:"🦄 "}
  body.t-unicorn .ps{color:#7A3FA8; border-top:2px dotted #FF9BD9}
  body.t-unicorn .meter{color:#FF3FA4}
  body.t-unicorn .pcanvas{filter:hue-rotate(-95deg) saturate(1.3); border:3px solid #FF6FC8; border-radius:12px}
  body.t-unicorn .portrait{filter:hue-rotate(-95deg) saturate(1.3); border:2px solid #FF6FC8; border-radius:10px}

  /* =========================================================
     THEME MINIMALISTE
     ========================================================= */
  body.t-minimal{background:#E9E9E7}
  body.t-minimal .monitor{
    background:#FFFFFF;
    border:1px solid #D2D2D0;
    border-radius:8px;
    box-shadow:0 2px 14px rgba(0,0,0,.08);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#1B1B1B;
  }
  body.t-minimal .monitor::after,
  body.t-minimal .monitor::before{opacity:0}
  body.t-minimal .sysbar{color:#8A8A88; border-bottom:1px solid #E2E2E0; font-size:14px}
  body.t-minimal h1{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:25px; font-weight:600; line-height:1.3; color:#111; text-shadow:none;
  }
  body.t-minimal p, body.t-minimal .log li{font-size:17px; line-height:1.55; color:#2A2A2A}
  body.t-minimal .dim{color:#767674}
  body.t-minimal .progress{color:#C4C4C2; font-size:16px}
  body.t-minimal .progress b{color:#111}
  body.t-minimal .opt, body.t-minimal .next,
  body.t-minimal .replay, body.t-minimal .themeswitch{
    font-family:inherit; font-size:17px;
    background:#fff; color:#1B1B1B;
    border:1px solid #C9C9C7; border-radius:6px; box-shadow:none;
  }
  body.t-minimal .opt .key{color:#767674}
  @media (hover:hover){
    body.t-minimal .opt:hover:not(:disabled){background:#F3F3F1}
  }
  body.t-minimal .opt.is-answer{background:#EAF7EE; border-color:#2E7D46; color:#1E5B31}
  body.t-minimal .opt.is-answer .key{color:#2E7D46}
  body.t-minimal .opt.is-wrongpick{background:#FBEDED; border-color:#B23A32; color:#8E2B25}
  body.t-minimal .opt.is-wrongpick .key{color:#8E2B25}
  body.t-minimal .start{
    font-family:inherit; font-size:17px; font-weight:600;
    background:#1B1B1B; color:#fff; border:none; border-radius:6px; box-shadow:none;
  }
  body.t-minimal .reveal{border-left:3px solid #1B1B1B; background:transparent}
  body.t-minimal .verdict .mark{font-family:inherit; font-size:18px; vertical-align:-1px}

function shuffle(a){
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

/* tirage : 2 perso + 2 pro garantis, 5e au hasard */
function draw(){
  const perso=shuffle(BANK.filter(q=>q.axe==="perso"));
  const pro=shuffle(BANK.filter(q=>q.axe==="pro"));
  const picked=[...perso.slice(0,2),...pro.slice(0,2)];
  picked.push(shuffle([...perso.slice(2),...pro.slice(2)])[0]);
  return shuffle(picked);
}

function powerOn(){
  const monitor = document.querySelector('.monitor');
  screen.innerHTML = "";

  const po = document.createElement('div');
  po.className = 'poweron';
  po.innerHTML = `<div class="pbar top"></div><div class="pbar bot"></div><div class="beam"></div>`;

  const beam = po.querySelector('.beam');
  const bars = po.querySelectorAll('.pbar');

  requestAnimationFrame(()=>{ beam.style.transform = 'scaleX(1)'; });

  setTimeout(()=>{
    monitor.classList.remove('off');

  }, 330);

  setTimeout(()=>{ po.remove(); boot(); }, 830);
}

function boot(){
  bootDone = false;
  const wink = WINKS[Math.floor(Math.random()*WINKS.length)];
  lastWink = wink;
  const monitor = document.querySelector('.monitor');

  screen.innerHTML = sysbar("CONNEXION") +
    `<div class="quoteblock" id="qb"></div>`;

  const qb = document.getElementById('qb');
  let typeTimer = null;

  /* ---- fin de sequence ---- */
  const finish = ()=>{
    if(bootDone) return;
    bootDone = true;
    clearTimeout(rainTimer);
    clearTimeout(typeTimer);
    cancelAnimationFrame(rainRAF);
    document.removeEventListener('click', finish);
    document.removeEventListener('keydown', finish);
    const c = monitor.querySelector('canvas.rain');
    if(c) c.remove();
    chooseTheme();
  };
  document.addEventListener('click', finish);
  document.addEventListener('keydown', finish);

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ finish(); return; }

  /* ---- machine a ecrire ---- */
  function type(el, text, speed, cb){
    let i = 0;
    el.innerHTML = '<span class="tc"></span>';
    const cur = el.querySelector('.tc');
    (function tick(){
      if(bootDone) return;
      if(i >= text.length){
        cur.remove();
        if(cb) typeTimer = setTimeout(cb, 0);
        return;
      }
      cur.insertAdjacentText('beforebegin', text[i]);
      i++;
      typeTimer = setTimeout(tick, text[i-1] === '\n' ? speed*6 : speed);
    })();
  }

  function addLine(cls){
    const el = document.createElement('p');
    el.className = cls;
    qb.appendChild(el);
    return el;
  }

  /* ---- coupure de la pluie ---- */
  function cutRain(cb){
    const c = monitor.querySelector('canvas.rain');
    const sw = document.createElement('div');
    sw.className = 'sweep';
    sw.style.setProperty('--sweepto', monitor.clientHeight + 'px');
    monitor.appendChild(sw);
    requestAnimationFrame(()=>{ sw.classList.add('go'); });
    if(c) c.classList.add('out');
    rainTimer = setTimeout(()=>{
      if(bootDone) return;
      sw.remove();
      if(c) c.remove();
      cancelAnimationFrame(rainRAF);
      cb();
    }, 720);
  }

  /* ---- transition vers l'ecran titre ---- */
  function sweep(){
    if(bootDone) return;
    const cv2 = monitor.querySelector('canvas.rain');
    if(cv2) cv2.classList.add('out');
    qb.classList.add('fadeout');

    const sw = document.createElement('div');
    sw.className = 'sweep';
    sw.style.setProperty('--sweepto', monitor.clientHeight + 'px');
    monitor.appendChild(sw);
    requestAnimationFrame(()=>{ sw.classList.add('go'); });

    rainTimer = setTimeout(()=>{ sw.remove(); finish(); }, 850);
  }

  /* ---- pluie verticale ---- */
  const cv = document.createElement('canvas');
  cv.className = 'rain';
  monitor.appendChild(cv);
  const W = cv.width = monitor.clientWidth;
  const H = cv.height = monitor.clientHeight;
  const ctx = cv.getContext('2d');

  const GLYPHS = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓ0123456789<>/\\[]{}=+*";
  const SIZE = 15;
  const cols = Math.floor(W / SIZE);
  const drops = Array.from({length: cols}, ()=> Math.random() * -40);

  ctx.fillStyle = '#0A0E0A';
  ctx.fillRect(0,0,W,H);

  let frame = 0;
  const SLOW = 4;                 // 1 avancee toutes les 4 images ~ 15 i/s

  function rain(){
    rainRAF = requestAnimationFrame(rain);
    if(++frame % SLOW) return;

    ctx.fillStyle = 'rgba(10,14,10,0.10)';
    ctx.fillRect(0,0,W,H);
    ctx.font = SIZE + "px 'VT323', monospace";
    for(let i=0;i<cols;i++){
      const ch = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
      const y = drops[i]*SIZE;
      ctx.fillStyle = '#C9FFD8';
      ctx.fillText(ch, i*SIZE, y);
      ctx.fillStyle = 'rgba(51,255,102,0.7)';
      ctx.fillText(ch, i*SIZE, y - SIZE);
      if(y > H && Math.random() > 0.98) drops[i] = 0;
      drops[i]++;
    }
  }
  rain();

  /* ---- enchainement, tout en frappe ---- */
  rainTimer = setTimeout(()=>{
    if(bootDone) return;
    cutRain(()=>{

    const conn = addLine('conn');
    type(conn, "Connexion au serveur interne sécurisé de l'Edulab.\nVeuillez patienter", 26, ()=>{
      conn.insertAdjacentHTML('beforeend', '<span class="dots"></span>');

      rainTimer = setTimeout(()=>{
        if(bootDone) return;
        qb.innerHTML = '';
        const line = addLine('line');

        type(line, "> " + wink.q, 48, ()=>{
          rainTimer = setTimeout(()=>{
            if(bootDone) return;
            const ask = addLine('ask');

            type(ask, "Si vous avez la ref, vous avez connu les disquettes.", 34, ()=>{
              const meter = addLine('loadbar');
              let pct = 0;

              (function fill(){
                if(bootDone) return;
                const blocks = Math.round(pct/5);
                meter.textContent = "[" + "█".repeat(blocks) + "·".repeat(20-blocks) +
                                    "] " + pct + "%";
                if(pct < 100){
                  pct += 2;
                  typeTimer = setTimeout(fill, 55);
                } else {
                  rainTimer = setTimeout(sweep, 700);
                }
              })();
            });
          }, 1600);
        });
      }, 1600);
    });
    });
  }, 2300);
}

function portraitReveal(){
  screen.innerHTML = sysbar("PORTRAIT.PCX") + `
    <p class="dim" id="pstat">Réception de l'image…</p>
    <canvas class="pcanvas" id="pc" width="220" height="270"></canvas>

  const cv = document.getElementById('pc');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.mozImageSmoothingEnabled = false;
  ctx.webkitImageSmoothingEnabled = false;

  const stat = document.getElementById('pstat');

  function done(){
    stat.innerHTML = "Image reçue.";
    document.getElementById('pbtn').innerHTML =
      `<button class="next" id="showprof" style="margin-top:18px">Continuer</button>`;
    document.getElementById('showprof').onclick = filmReveal;
  }

  const img = new Image();
  img.onload = ()=>{
    const S = 5;
    const total = img.height;

    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      ctx.drawImage(img, 0, 0, img.width, total, 0, 0, img.width*S, total*S);
      done();
      return;
    }

    let row = 0;
    (function drawRow(){
      ctx.drawImage(img, 0, row, img.width, 1, 0, row*S, img.width*S, S);
      row++;
      stat.innerHTML = "Réception de l'image… " + Math.round(row/total*100) + "%";
      if(row < total) setTimeout(drawRow, 42);
      else setTimeout(done, 300);
    })();
  };

  img.src = PORTRAIT_SRC;
}

function question(){

    bar() + `

function answer(choice){
  const q=quiz[step];
  const good = choice===q.correct;
  if(good) score++;

  screen.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.correct) b.classList.add('is-answer');
    else if(i===choice) b.classList.add('is-wrongpick');
    else b.classList.add('is-mute');
  });

  const last = step===4;
  document.getElementById('rev').innerHTML=`
    <div class="reveal">
      <span class="verdict ${good?'ok':'ko'}"><span class="mark"></span>${good?'Réponse correcte':'Réponse incorrecte'}</span>
      <p>${q.reveal}</p>
      <button class="next" id="nx">${last?'Afficher le profil complet':'Question suivante'}</button>
    </div>`;
  document.getElementById('nx').onclick=()=>{
    step++;
    if(step<5) question(); else compile();
  };
}
